<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Glamorous</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-container">
    <h1>Create Account</h1>
    <p>Join Glamorous today and feel the glow!</p>

    <form action="your-signup-handler.php" method="post">
      <input 
        type="text" 
        name="name" 
        placeholder="Full Name" 
        required 
        class="input-field"
      />
      <input 
        type="email" 
        name="email" 
        placeholder="Email" 
        required 
        class="input-field"
      />
      <input 
        type="password" 
        name="password" 
        placeholder="Password" 
        required 
        class="input-field"
      />
      <button type="submit" class="btn">Sign Up</button>
    </form>
  </div>
</body>
</html>
